<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MeetingScribe</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>🎙️ MeetingScribe</h1>
    <span class="tag">local · key-free · MIT</span>
    <span id="conn" class="dot" title="live connection"></span>
  </header>

  <main>
    <section id="left">
      <div class="card" id="record-card">
        <h2>New recording</h2>
        <input id="title" placeholder="Meeting title" />
        <div class="row">
          <select id="platform">
            <option value="meet">Google Meet</option>
            <option value="zoom">Zoom</option>
            <option value="other">Other</option>
          </select>
          <label><input type="checkbox" id="cap-mic" checked /> Mic (Me)</label>
          <label><input type="checkbox" id="cap-sys" checked /> System (Others)</label>
        </div>
        <div class="row">
          <button id="btn-start" class="primary">● Start</button>
          <button id="btn-stop" class="danger" disabled>■ Stop</button>
        </div>
        <p id="rec-status" class="muted">Idle.</p>
      </div>

      <div class="card">
        <h2>Search all meetings</h2>
        <input id="search" placeholder="Search transcripts…" />
        <div id="search-results"></div>
      </div>

      <div class="card">
        <h2>Meetings</h2>
        <ul id="meeting-list"></ul>
      </div>
    </section>

    <section id="right">
      <div class="card" id="live-card">
        <h2>Live transcript <span id="live-flag" class="muted"></span></h2>
        <div id="live"></div>
      </div>

      <div class="card hidden" id="detail-card">
        <div class="row between">
          <h2 id="detail-title">Meeting</h2>
          <div>
            <select id="export-fmt" class="ghost" title="Export / download">
              <option value="">Export…</option>
              <option value="md">Markdown (.md)</option>
              <option value="txt">Plain text (.txt)</option>
              <option value="srt">Subtitles (.srt)</option>
              <option value="vtt">WebVTT (.vtt)</option>
              <option value="json">JSON (.json)</option>
            </select>
            <button id="btn-reprocess" class="ghost">Reprocess</button>
            <button id="btn-delete" class="ghost danger-text">Delete</button>
          </div>
        </div>
        <p id="detail-meta" class="muted"></p>
        <audio id="player" controls preload="none"></audio>

        <div id="summary"></div>
        <h3>Action items</h3>
        <ul id="actions"></ul>

        <h3>Talk time</h3>
        <div id="analytics"></div>

        <h3>Notes &amp; highlights</h3>
        <div class="row">
          <input id="comment-input" placeholder="Add a note or comment…" />
          <button id="btn-comment" class="primary">Add</button>
        </div>
        <div id="annotations"></div>

        <h3>Ask this meeting</h3>
        <div class="row">
          <input id="chat-q" placeholder="e.g. What did we decide about the budget?" />
          <button id="btn-ask" class="primary">Ask</button>
        </div>
        <div id="chat-answer"></div>

        <h3>Transcript</h3>
        <div id="transcript"></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
